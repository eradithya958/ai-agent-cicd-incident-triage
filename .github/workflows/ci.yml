name: Fleet Telemetry CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Lint Tools
        run: |
          pip install --upgrade pip
          pip install ruff
      - name: Run Ruff Linter
        run: ruff check .

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit
      - name: Run Pip Audit & Bandit
        run: |
          pip-audit --ignore-vuln=NONE || true
          bandit -r app/ -ll

  test-suite:
    runs-on: ubuntu-latest
    needs: [lint-and-quality]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Test Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run Pytest Test Suite
        run: pytest tests/ tests_agent/ -v

  build-package:
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - uses: actions/checkout@v4
      - name: Simulate Container Packaging
        run: |
          echo "Simulating container build for fleet-telemetry-gateway..."
          test -f app/main.py

  deploy-simulation:
    runs-on: ubuntu-latest
    needs: [build-package]
    steps:
      - uses: actions/checkout@v4
      - name: Staging Canary Health Probe
        run: |
          echo "Verifying deployment healthcheck endpoint /healthz..."
